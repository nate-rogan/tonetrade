name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true  # reuse the environment while pixi.lock is unchanged

      - name: Lint
        run: pixi run lint

      - name: Unit tests
        run: pixi run test
